# Stage 1: Retrieval Pretraining Configuration
# Based on Llama-Embed-Nemotron paper (Appendix A, Table 8)

# Model
model_name: "meta-llama/Llama-3.2-1B"
max_length: 512
hidden_size: 2048  # For Llama-3.2-1B

# Training
output_dir: "./outputs/stage1"
num_epochs: 1
batch_size: 32  # Per device
gradient_accumulation_steps: 1
learning_rate: 1.0e-5
weight_decay: 0.01
warmup_ratio: 0.1
max_grad_norm: 1.0

# Loss
temperature: 0.02
num_negatives: 1  # Stage 1 uses 1 hard negative
use_in_batch_negatives: false

# Optimization
optimizer: "adamw"
scheduler: "cosine"
adam_beta1: 0.9
adam_beta2: 0.999
adam_epsilon: 1.0e-8

# Hardware
device: "cuda"
fp16: true
bf16: false
gradient_checkpointing: true

# Logging
logging_steps: 10
save_steps: 500
eval_steps: 500
save_total_limit: 3
log_to_wandb: false
wandb_project: "llama-embed-nemotron-1b"
wandb_run_name: "stage1"

# Data
dataloader_num_workers: 4
dataloader_pin_memory: true

# Task
task_type: "retrieval"
instruction: "Retrieve relevant passages for this query"

# Data paths (update these)
train_data_path: "data/stage1_train.jsonl"
corpus_path: "data/corpus.txt"

# Misc
seed: 42
